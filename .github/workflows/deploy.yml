# Build the app and publish it to GitHub Pages.
#
# The two Supabase values the build needs live in .env, committed on purpose —
# they are public by design and the anon key has no database privileges (see
# the comment in .env). So there is nothing to configure here, and no secret
# whose absence could make a deploy silently produce a broken app.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time, but never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
